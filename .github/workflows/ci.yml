name: CI

# Run on every push to main and on every pull request targeting main.
# This catches regressions before they reach production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vet, Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet (catches obvious bugs the compiler misses)
        run: go vet ./...

      - name: golangci-lint (style, complexity, error handling checks)
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinning a specific version prevents unexpected CI breakages when new releases drop support for older Go versions or introduce backward-incompatible checks.
          version: v2.12.2
          working-directory: backend
          args: --timeout=5m

      - name: go test (unit tests)
        run: go test ./...
